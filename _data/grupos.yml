logica:
  nombre:
      "Logica Computacional"
  descripcion:
      "Los principales temas de investigación del grupo se encuentran en la intersección de la Lógica Formal y las Ciencias de la Computación. El grupo tiene lineas de investigación abiertas en el estudio de propiedades meta-lógicas de: lógicas nomonótonas; lógicas default; lógicas deónticas; lógicas dinámicas; y lógicas con datos."
